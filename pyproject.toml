[project]
name = "ampx"
version = "0.1.0"
description = "AMP Challenge 2027 submission: generative design of antimicrobial peptides"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@your-institution.edu" }]

dependencies = [
    "numpy>=1.26",
    "levenshtein>=0.27",
]

[project.optional-dependencies]
# Heavy deps live behind extras so the organizers' `uv sync` stays fast.
# If your generator needs torch at inference time, promote it to `dependencies`.
train = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.2",
    "biopython>=1.83",
    "modlamp>=4.3",
    "peptides>=0.3",
]
eval = [
    "seqme>=0.1",
    "matplotlib>=3.8",
]

[project.scripts]
generate = "ampx.generate:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ampx"
module-root = "src"

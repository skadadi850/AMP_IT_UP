[project]
name = "ampx"
version = "0.1.0"
description = "AMP Challenge 2027 submission: generative design of antimicrobial peptides"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME", email = "you@your-institution.edu" }]

# Everything the `generate` entry point touches at inference time. The
# organizers run a bare `uv sync`, so anything omitted here is simply absent
# when they run us.
#
# torch, transformers and xgboost are pinned exactly rather than floored,
# because each one decides how a shipped checkpoint is interpreted:
#   * xgboost 3.2.0 is the version that wrote checkpoints/mic_regressor.json
#     (recorded in its own `version` field). That model carries 1807 trees
#     with best_iteration=1706, so 101 trees sit past the early-stopping
#     point and whether a reader truncates there or predicts with all of
#     them changes every MIC estimate, and with it the top 100.
#   * transformers 5.17.0 produced the 480-d ESM-2 embedding block that the
#     regressor's 510 input features are built on.
#   * torch 2.11.0 trained checkpoints/masked_diffusion_best.pt.
dependencies = [
    "numpy>=1.26",
    "levenshtein>=0.27",
    "pandas>=2.2",
    "rapidfuzz>=3.14",
    "tqdm>=4.66",
    "torch==2.11.0",
    "transformers==5.17.0",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
# Training-only. scipy lands here rather than in `dependencies` because the
# entry point never reaches it: it is imported by models/metrics.py and the
# calibration/analysis scripts, none of which are on the generate path.
train = [
    "scikit-learn>=1.4",
    "scipy>=1.15",
    "biopython>=1.83",
    "modlamp>=4.3",
    "peptides>=0.3",
]
eval = [
    "seqme>=0.1",
    "matplotlib>=3.8",
]

[project.scripts]
generate = "ampx.generate:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ampx"
module-root = "src"
